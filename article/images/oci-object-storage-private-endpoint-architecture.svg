<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">OCI Object Storage private endpoint architecture</title>
  <desc id="desc">A workload in a private subnet reaches an OCI Object Storage private endpoint over HTTPS. The private endpoint has a bucket-scoped access target and connects to a private Object Storage bucket.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172b4d; }
      .label { font: 700 18px Arial, sans-serif; fill: #172b4d; }
      .body { font: 15px Arial, sans-serif; fill: #344563; }
      .small { font: 14px Arial, sans-serif; fill: #344563; }
      .vcn { fill: #eef6ff; stroke: #4c8eda; stroke-width: 3; }
      .subnet { fill: #ffffff; stroke: #7aa7d8; stroke-width: 2; }
      .workload { fill: #d9f2e6; stroke: #318f68; stroke-width: 2; }
      .endpoint { fill: #fce9cf; stroke: #d9822b; stroke-width: 2; }
      .bucket { fill: #e8e0f5; stroke: #6b5ca5; stroke-width: 2; }
      .target { fill: #fff7d6; stroke: #b38600; stroke-width: 2; }
      .arrow { stroke: #2f6fad; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f6fad"/>
    </marker>
  </defs>

  <rect width="1200" height="570" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">OCI Object Storage Private Endpoint with Terraform</text>

  <rect x="55" y="95" width="700" height="390" rx="18" class="vcn"/>
  <text x="85" y="132" class="label">Customer VCN</text>
  <text x="85" y="158" class="body">Private network path for workloads and the Object Storage private endpoint</text>

  <rect x="100" y="195" width="245" height="205" rx="12" class="subnet"/>
  <text x="222" y="228" text-anchor="middle" class="label">Workload subnet</text>
  <rect x="145" y="265" width="155" height="88" rx="10" class="workload"/>
  <text x="222" y="301" text-anchor="middle" class="label">Workload</text>
  <text x="222" y="326" text-anchor="middle" class="small">Compute or connected host</text>

  <rect x="440" y="195" width="260" height="205" rx="12" class="subnet"/>
  <text x="570" y="228" text-anchor="middle" class="label">Private endpoint subnet</text>
  <rect x="477" y="260" width="186" height="98" rx="10" class="endpoint"/>
  <text x="570" y="296" text-anchor="middle" class="label">Private endpoint</text>
  <text x="570" y="321" text-anchor="middle" class="small">Private IP and FQDNs</text>
  <text x="570" y="343" text-anchor="middle" class="small">HTTPS / TCP 443</text>

  <path d="M300 309 L477 309" class="arrow"/>
  <text x="388" y="286" text-anchor="middle" class="small">Private HTTPS access</text>

  <rect x="830" y="160" width="315" height="270" rx="18" class="bucket"/>
  <text x="987" y="202" text-anchor="middle" class="label">OCI Object Storage</text>
  <rect x="880" y="238" width="215" height="70" rx="10" fill="#ffffff" stroke="#6b5ca5" stroke-width="2"/>
  <text x="987" y="267" text-anchor="middle" class="label">Private bucket</text>
  <text x="987" y="290" text-anchor="middle" class="small">No public access</text>
  <rect x="880" y="332" width="215" height="60" rx="10" class="target"/>
  <text x="987" y="358" text-anchor="middle" class="label">Access target</text>
  <text x="987" y="379" text-anchor="middle" class="small">Namespace + compartment + bucket</text>

  <path d="M663 309 L880 309" class="arrow"/>
  <text x="772" y="286" text-anchor="middle" class="small">Bucket-scoped access</text>

  <text x="600" y="525" text-anchor="middle" class="body">Terraform manages the VCN, private subnet, security rules, bucket, private endpoint, and bucket-scoped access target.</text>
</svg>
